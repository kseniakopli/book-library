# Статический анализ бэкенда (задача 95).
#
# Зачем: 28.07 в коде нашлись ДВА неопределённых имени, пережившие рефакторинг
# 26.07 и полный прогон тестов — `_search_track` (кнопка «Создать плейлист»
# падала с 500 для всех книг) и `_sync_playlist` (пересборка плейлиста после
# удаления трека молча падала в фоновой задаче). Тесты их не увидели: первое
# место во всех тестах роутера подменяется заглушкой целиком, второе живёт
# в фоновой задаче с проглоченным исключением. Линтер находит такое без
# запуска кода, без моков и за долю секунды.
#
# Локально:  python -m ruff check .      (из папки backend/)
# В CI:      шаг «Lint (ruff)» в .github/workflows/ci.yml

target-version = "py312"
line-length = 100

exclude = ["alembic/versions", "__pycache__", "backups"]

[lint]
# ТОЛЬКО ошибки, а не стиль — сознательно.
#   F   — pyflakes: неопределённые имена, неиспользуемые импорты и переменные,
#         дубли ключей, f-string без подстановок. Это класс «код не работает».
#   E9  — синтаксис и ошибки разбора.
# Форматирование и стиль (E1-E7, W, I) не включаем: проект писался без них,
# массовое переформатирование дало бы огромный дифф и ноль пользы. Захочется
# позже — включать по одному правилу и чинить отдельным коммитом.
select = ["F", "E9"]

[lint.per-file-ignores]
# Скрипты кладут backend/ в sys.path импортом-побочкой — он «не используется»
"scripts/*" = ["F401"]
