<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Полумесяц в тон бренду nocturne. Собран из двух кругов: тело слева,
       вырез справа → месяц «смотрит вправо», как символ ☾ на кнопке темы.
       Чтобы развернуть влево — поменять cx у кругов местами (11 ↔ 16). -->
  <mask id="moon">
    <rect width="24" height="24" fill="#000" />
    <circle cx="11" cy="12" r="9" fill="#fff" />
    <circle cx="16" cy="12" r="8" fill="#000" />
  </mask>
  <!-- Задача 100: было #d68a2e (терракота). Взят средний винный, а не один
       из акцентов тем: #7a2740 тонет на тёмной вкладке, #cf7b93 — на светлой.
       #a8455e даёт 5.7:1 на белой вкладке и 3.3:1 на тёмной. -->
  <rect width="24" height="24" fill="#a8455e" mask="url(#moon)" />
</svg>
